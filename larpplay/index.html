  <style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:#000;color-scheme:dark;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:3px}[hidden]{display:none!important}
.receiver,.display{position:relative;width:100%;min-height:100dvh;background:#000}.display{display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;touch-action:none}
.connection-screen{position:absolute;inset:0;display:grid;place-items:center;background:#000;padding:28px}.center-stack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:42px;width:100%;max-width:360px;transform:translateY(-10px)}
.brand{display:flex;align-items:center;flex-direction:column;gap:12px}.brand-icon{width:108px;height:108px}.brand h1{font-size:25px;line-height:1.1;letter-spacing:-.045em;font-weight:600;margin:0;color:#f5f5f5}
.connection-form{display:flex;flex-direction:column;align-items:center;gap:24px;width:100%}.endpoint{width:100%;display:grid;grid-template-columns:minmax(0,11ch) 1ch 5ch;align-items:center;justify-content:center;column-gap:9px;border:1px solid #ffffff2c;background:#111;border-radius:13px;padding:0 13px;transition:border-color .2s}.endpoint:focus-within{border-color:#ffffff90}
.endpoint input{min-width:0;height:50px;border:0;background:transparent;color:#f3f3f3;outline:none;font-size:14px;font-weight:450;font-variant-numeric:tabular-nums}.endpoint #host{width:100%;text-align:center}.endpoint #port{width:100%;text-align:center;appearance:textfield;-moz-appearance:textfield}.endpoint #port::-webkit-inner-spin-button,.endpoint #port::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.colon{color:#8b8b8b;text-align:center}
.connect{width:56px;height:56px;display:grid;place-items:center;position:relative;border:1px solid #ffffff44;border-radius:50%;color:#e5e5e5;background:#ffffff0d;transition:background .2s,border-color .2s,transform .2s}.connect:hover:not(:disabled){background:#ffffff1b;border-color:#ffffff80;transform:scale(1.04)}.connect svg{width:24px;height:24px}.connect .spinner{display:none;position:absolute;inset:11px;border:2px solid #ffffff35;border-top-color:#fff;border-radius:50%;animation:spin .85s linear infinite}
[data-stage=connecting] .connect svg{opacity:0}[data-stage=connecting] .spinner{display:block}
.gear{position:fixed;z-index:5;top:clamp(14px,2.4vw,26px);right:clamp(14px,2.4vw,26px);width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:#0b0b0b88;color:#fff;opacity:.8;transition:opacity .16s,background .16s}.gear svg{width:21px;height:21px}.gear:hover{opacity:1;background:#252525}
.error{max-width:100%;margin:0;color:#ffb7b7;text-align:center;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.settings-overlay{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:16px;background:#000b;backdrop-filter:blur(18px);overflow:auto}.settings-card{width:min(100%,430px);max-height:calc(100dvh - 32px);overflow-y:auto;border:1px solid #ffffff22;border-radius:19px;background:#151515;padding:25px;box-shadow:0 28px 100px #000c}
.settings-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}.settings-header h2{font-size:21px;letter-spacing:-.04em;font-weight:600;margin:0}.close{border:0;border-radius:50%;width:33px;height:33px;background:#ffffff14;color:#fff;font-size:24px;line-height:1}.close:hover{background:#ffffff27}
.field-group{display:grid;grid-template-columns:1fr;gap:7px}.settings-card label{font-size:12px;font-weight:550;color:#d1d1d1}.settings-card select{width:100%;height:43px;border:1px solid #ffffff29;border-radius:10px;color:#fff;background:#090909;padding:0 12px;margin-bottom:11px}.settings-card select:focus{border-color:#fff9}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.action{border:1px solid #ffffff29;background:#ffffff10;color:#fff;border-radius:10px;padding:11px 14px;font-size:12px;flex:1;white-space:nowrap}.action:hover:not(:disabled){background:#ffffff20}.action:disabled{opacity:.35}
.advanced{border-top:1px solid #ffffff1e;margin-top:22px;padding-top:18px}.advanced summary{color:#a9a9a9;font-size:12px;cursor:pointer}.advanced label{display:block;margin:14px 0 6px}.advanced input[type=file]{width:100%;color:#aaa;font-size:12px}.advanced .action{width:100%;margin-top:18px}.hint{font-size:12px;color:#919191;margin:13px 0 0;overflow-wrap:anywhere}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation-duration:2s}.connect,.gear{transition:none}}@media(max-width:480px){.settings-card{padding:20px}.center-stack{gap:34px}}

/* Small selector keeps the center screen minimal while supporting both transports. */
.transport{width:auto;max-width:100%;min-height:32px;padding:4px 12px;border:1px solid #ffffff27;border-radius:8px;background:#121212;color:#dddddd;font-size:12px;text-align:center;cursor:pointer}
.transport:focus-visible{outline:2px solid #fff;outline-offset:2px}
